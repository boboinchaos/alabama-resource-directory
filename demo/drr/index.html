<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo preview: AI assistant for Disability Rights &amp; Resources</title>
<style>
body{margin:0;background:#eef1f4;font:15px/1.4 system-ui,Segoe UI,sans-serif}
.bar{position:sticky;top:0;z-index:10;background:#0b1626;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.bar b{color:#ffd23f}
.site{max-width:1351px;margin:0 auto;background:#fff}
.site img{display:block;width:100%;height:auto}
.site{position:relative}
.wave{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:0;font:700 13px/1.15 system-ui,Segoe UI,sans-serif;color:#1d6f8a;text-align:center;width:120px}
.wave .hand{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25);display:grid;place-items:center;font-size:30px;line-height:1}
.wave .hand span{display:inline-block;transform-origin:70% 75%;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-4deg)}75%{transform:rotate(8deg)}}
.wave:hover .hand{transform:scale(1.06)}.wave:focus-visible{outline:3px solid #ffd23f;outline-offset:4px;border-radius:12px}
.wave.fixed{position:fixed;right:14px;bottom:14px;background:#fff;border-radius:14px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.wave .hand span{animation:none}}
.note{max-width:1351px;margin:0 auto;padding:10px 16px;color:#5a6b7d;font-size:13px;text-align:center}
</style></head><body>
<div class="bar"><span><b>Demo preview</b> for Disability Rights &amp; Resources: this is a picture of your homepage with a working AI assistant added.</span><span>Try it: click the waving hand to chat or talk.</span></div>
<div class="site" id="site"><button class="wave" id="wave" type="button" aria-label="Click here for a quick question"><span class="hand"><span aria-hidden="true">👋</span></span><span>Click here for a quick question</span></button><img id="shot" src="drr-home.jpg" alt="Picture of the Disability Rights & Resources homepage, used for this demo"></div>
<p class="note">Private demo page. Not the live drradvocates.org site, and links in the picture don't work. Prepared by Jason Bourbeau.</p>
<!-- Riley: chat + voice (GoHighLevel all-in-one widget) -->
<script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6aecd79f6e7a665a17c7adda"></script>
<script>
(function(){
  var w=document.getElementById('wave'), img=document.getElementById('shot');
  // Spot just left of DRR's email button in the screenshot (image is 1351px wide).
  function place(){ var k=img.clientWidth/1351;
    if(img.clientWidth<700){ w.classList.add('fixed'); w.style.left=w.style.top=''; return; }
    w.classList.remove('fixed'); w.style.left=(1068*k-120)+'px'; w.style.top=(22*k)+'px'; }
  img.complete?place():img.addEventListener('load',place); addEventListener('resize',place);
  // Hide the widget's own corner button; the waving hand opens it instead.
  function hideLauncher(){ var cw=document.querySelector('chat-widget'); var sr=cw&&cw.shadowRoot;
    if(!sr||sr.getElementById('hide-bubble')) return !!sr;
    var st=document.createElement('style'); st.id='hide-bubble';
    st.textContent='.lc_text-widget--bubble,.lc_text-widget_prompt,[class*="widget_prompt"]{display:none!important}';
    sr.appendChild(st); return true; }
  var tries=0, t=setInterval(function(){ if(hideLauncher()||++tries>60) clearInterval(t); },500);
  w.addEventListener('click',function(){
    var lc=window.leadConnector&&window.leadConnector.chatWidget;
    if(lc&&lc.openWidget){ lc.openWidget(); return; }
    var cw=document.querySelector('chat-widget'), b=cw&&cw.shadowRoot&&cw.shadowRoot.querySelector('.lc_text-widget--bubble'); if(b) b.click();
  });
})();
</script>
</body></html>
