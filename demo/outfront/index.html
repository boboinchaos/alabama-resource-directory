<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo preview: AI assistant for Out Front Hitting</title>
<style>
body{margin:0;background:#eef1f4;font:15px/1.4 system-ui,Segoe UI,sans-serif}
.bar{position:sticky;top:0;z-index:10;background:#1c2f45;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.bar b{color:#ff6b6b}
.site{position:relative;max-width:1351px;margin:0 auto;background:#fff}
.site img{display:block;width:100%;height:auto}
.bat{position:absolute;z-index:5;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #1c2f45;border-radius:40px;cursor:pointer;padding:3px 14px 3px 3px;font:700 14px/1.1 system-ui,Segoe UI,sans-serif;color:#1c2f45;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.18);transform-origin:left center}
.bat .icon{width:54px;height:54px;border-radius:50%;background:#9b111e;display:grid;place-items:center;flex:none}
.bat .icon svg{width:46px;height:46px;overflow:visible}
.bat small{display:block;font-weight:500;font-size:12px;color:#9b111e}
.bat:hover{box-shadow:0 5px 14px rgba(0,0,0,.28)}
.bat:focus-visible{outline:3px solid #9b111e;outline-offset:3px}
.bat.fixed{position:fixed;left:auto!important;top:auto!important;right:14px;bottom:14px;transform:none!important}
/* swing: bat + arms rotate through the zone, ball launches off the barrel */
.swing{transform-box:view-box;transform-origin:24px 22px;animation:swing 2.6s cubic-bezier(.45,0,.25,1) infinite}
@keyframes swing{0%,30%{transform:rotate(-115deg)}44%{transform:rotate(0deg)}58%{transform:rotate(-155deg)}80%{transform:rotate(-155deg)}100%{transform:rotate(-115deg)}}
.ball{animation:ball 2.6s linear infinite}
@keyframes ball{0%,20%{transform:translate(64px,24px);opacity:0}24%{opacity:1}44%{transform:translate(44px,22px);opacity:1}62%{transform:translate(64px,-6px);opacity:.9}70%,100%{transform:translate(70px,-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.swing,.ball{animation:none}.swing{transform:rotate(0deg)}}
.note{max-width:1351px;margin:0 auto;padding:10px 16px;color:#5a6b7d;font-size:13px;text-align:center}
</style></head><body>
<div class="bar"><span><b>Demo preview</b> for Out Front Hitting: this is a picture of your homepage with a working AI assistant added.</span><span>Try it: click the hitter under Subscribe to chat or talk.</span></div>
<div class="site" id="site">
<button class="bat" id="bat" type="button" aria-label="Questions? Chat or talk with Alex">
<span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true">
  <!-- batter -->
  <g fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="10" r="4.2" stroke="none"/>
    <path d="M17.5 9.2h9" stroke-width="2"/>
    <path d="M22 15l1 13" stroke-width="4.5" fill="none"/>
    <path d="M23 28l-6 10 -1 6M23 28l5 8 4 7" stroke-width="3.4" fill="none"/>
  </g>
  <!-- arms + bat swing together -->
  <g class="swing">
    <path d="M22 18l2 4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 22l20 0" stroke="#f3d7a6" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M38 22l7 0" stroke="#f3d7a6" stroke-width="4.4" stroke-linecap="round"/>
  </g>
  <circle class="ball" cx="0" cy="0" r="2.8" fill="#fff" stroke="#9b111e" stroke-width=".8"/>
</svg></span>
<span>Questions? Ask Alex<small>Chat or talk now</small></span>
</button>
<img id="shot" src="ofh-home.jpg" alt="Picture of the Out Front Hitting homepage, used for this demo">
</div>
<p class="note">Private demo page. Not the live outfronthitting.com site, and links in the picture don't work. Prepared by Jason Bourbeau.</p>
<!-- Out Front Hitting: chat + voice (GoHighLevel all-in-one widget) -->
<script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6aedf08d5fefb844994142b9"></script>
<script>
(function(){
  var b=document.getElementById('bat'), img=document.getElementById('shot');
  // Centered under the Subscribe button, in the white strip (screenshot is 1351px wide; strip is y 76-162).
  function place(){ var k=img.clientWidth/1351;
    if(img.clientWidth<700){ b.classList.add('fixed'); return; }
    b.classList.remove('fixed');
    var s=Math.min(1,Math.max(.7,k)); b.style.transform='scale('+s+')';
    b.style.left=(248*k - b.offsetWidth*s/2)+'px'; b.style.top=(119*k - b.offsetHeight*s/2)+'px'; }
  img.complete?place():img.addEventListener('load',place); addEventListener('resize',place);
  // Hide the widget's own corner button; the hitter opens it instead.
  function hideLauncher(){ var cw=document.querySelector('chat-widget'); var sr=cw&&cw.shadowRoot;
    if(!sr||sr.getElementById('hide-bubble')) return !!sr;
    var st=document.createElement('style'); st.id='hide-bubble';
    st.textContent='.lc_text-widget--bubble,.lc_text-widget_prompt,[class*="widget_prompt"]{display:none!important}';
    sr.appendChild(st); return true; }
  var tries=0, t=setInterval(function(){ if(hideLauncher()||++tries>60) clearInterval(t); },500);
  b.addEventListener('click',function(){
    var lc=window.leadConnector&&window.leadConnector.chatWidget;
    if(lc&&lc.openWidget){ lc.openWidget(); return; }
    var cw=document.querySelector('chat-widget'), x=cw&&cw.shadowRoot&&cw.shadowRoot.querySelector('.lc_text-widget--bubble'); if(x) x.click();
  });
})();
</script>
</body></html>
